name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, develop]
    paths-ignore:
      - "**/LICENSE"
      - ".editorconfig"
      - ".github/workflows/create-tag.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/licenses.yml"
  pull_request:
    paths-ignore:
      - "**/LICENSE"
      - ".editorconfig"
      - ".github/workflows/create-tag.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/licenses.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck & docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Check the API reference is up to date
        run: |
          npm run docs
          git add --intent-to-add docs
          git diff --exit-code -- docs

  test:
    name: Test & build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:exports
      - run: npm pack --dry-run

  integration:
    name: Integration tests
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration
        env:
          DOCS_KEEP: "1"
      - name: Document server logs
        if: failure()
        run: docker compose -f docker-compose.integration.yml logs documentserver
